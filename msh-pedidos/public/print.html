<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedido · MSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  html,body{background:#fff;color:#141414;}
  body{font-size:13px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .pr{max-width:820px;margin:0 auto;padding:28px 24px 60px;}
  .noprint{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;}
  .pr-head{display:flex;align-items:center;gap:16px;border-bottom:2px solid #d4af37;padding-bottom:16px;margin-bottom:18px;}
  .pr-head h1{font-size:28px;color:#141414;margin:0;line-height:1.15;}
  .pr-brand{font-family:var(--serif);font-size:14px;color:#8a6d12;margin-bottom:4px;}
  .pr-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
  .pr-meta div{border:1px solid #e3e3e3;border-radius:12px;padding:9px 12px;} .pr-meta b{display:block;font-size:13.5px;margin-top:2px;}
  .pr-meta span{font-size:11px;color:#777;}
  .pr h2{font-family:var(--serif);font-weight:400;font-size:20px;margin:22px 0 10px;color:#141414;}
  .pr table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:0;}
  .pr th{background:#f4f1e6;color:#141414;border-bottom:1px solid #d9d2b3;padding:7px 8px;font-size:11.5px;text-align:left;}
  .pr td{padding:7px 8px;border-bottom:1px solid #ececec;vertical-align:middle;color:#141414;}
  .pr tr.grp td{background:#faf8f0;font-weight:600;border-top:1px solid #d9d2b3;}
  .pr .thumb{width:34px;height:34px;margin:0;border-color:#ddd;}
  .pr .fin{background:#f4f1e6;border-color:#d9d2b3;color:#141414;}
  .pr .box,.gt{break-inside:avoid;page-break-inside:avoid;}
  .pr .box{background:#faf8f0;border-color:#e3dcc0;}
  .pr .mini{color:#666;}
  .pr-foot{margin-top:26px;font-size:11px;color:#888;border-top:1px solid #e3e3e3;padding-top:10px;}
  .btn{text-decoration:none;display:inline-block;}
  @media print{ .noprint{display:none !important;} .pr{padding:0;max-width:none;} @page{size:A4;margin:14mm;} }
  @media(max-width:700px){.pr-meta{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="pr" id="pr"><p>Cargando…</p></div>
<script src="/js/core.js"></script>
<script>
(async function () {
  const root = document.getElementById('pr');
  try {
    const id = new URLSearchParams(location.search).get('id');
    const me = await fetch('/api/me', { credentials: 'same-origin' }).then(r => r.json());
    if (!me.user) { root.innerHTML = '<p>Tu sesión ha caducado. <a href="/">Entra de nuevo</a> y vuelve a pulsar «Exportar PDF».</p>'; return; }
    if (me.today) S.today = me.today;
    const r = await fetch('/api/orders/' + encodeURIComponent(id), { credentials: 'same-origin' });
    if (!r.ok) { root.innerHTML = '<p>No se encontró el pedido.</p>'; return; }
    const o = await r.json();
    document.title = ordTitle(o) + ' · ' + o.client_name;

    const rows = [];
    const groups = new Map();
    o.lines.forEach(l => {
      if (l.kind === 'pack') {
        const k = 'p' + l.group_no;
        if (!groups.has(k)) { groups.set(k, { pack: l.pack_name, qty: l.qty, lines: [] }); rows.push(groups.get(k)); }
        groups.get(k).lines.push(l);
      } else rows.push(l);
    });
    const fins = l => (l.finishes || []).map(f => '<span class="fin">' + esc(f.name) + (f.value ? ': ' + esc(f.value) : '') + '</span>').join('') || '<span class="mini">—</span>';
    const pr = o.total != null;
    const amt = l => pr ? '<td style="text-align:right">' + (l.amount != null && (l.unit_price != null || l.kind === 'pack') ? money(l.amount) : '—') + '</td>' : '';
    const line = (l, qty) => '<tr><td>' + thumb(l.photo) + '</td><td>' + esc(l.product_name) + (l.kind === 'free' ? ' <span class="mini">(fuera de catálogo)</span>' : '') + '</td><td>' + (esc(l.size) || '—') + '</td><td>' + (esc(l.color) || '—') + '</td><td>' + fins(l) + '</td><td style="text-align:right"><b>' + qty + '</b></td>' + (pr ? '<td style="text-align:right">' + (l.kind === 'pack' ? '<span class="mini">en pack</span>' : (l.unit_price != null ? money(l.unit_price) : '—')) + '</td>' + amt(l) : '') + '</tr>';
    let body = '';
    rows.forEach(g => {
      if (g.lines) {
        const pp = g.lines[0].pack_price, gt = g.lines.reduce((a, l) => a + (l.amount || 0), 0);
        body += '<tr class="grp"><td colspan="5">' + esc(g.pack) + '</td><td style="text-align:right">× ' + g.qty + '</td>' + (pr ? '<td style="text-align:right">' + (pp != null ? money(pp) : '—') + '</td><td style="text-align:right">' + money(gt) + '</td>' : '') + '</tr>';
        g.lines.forEach(l => { body += line(l, g.qty); });
      } else body += line(g, g.qty);
    });
    const cron = showsGantt(o)
      ? '<h2>Cronograma</h2>' + gantt(o, { wide: true, tw: 700 })
      : '<h2>Estado</h2>' + estadoBox(o);
    root.innerHTML =
      '<div class="noprint"><span class="mini">Para guardar el PDF, en la ventana de impresión elige «Guardar como PDF».</span><button class="btn amber" onclick="window.print()">Imprimir o guardar PDF</button></div>' +
      '<div class="pr-head">' + crestHTML({ name: o.client_name, crest: o.client_crest, color: o.client_color }, true) +
      '<div><div class="pr-brand">MSH Madrid</div><h1>' + esc(ordTitle(o)) + '</h1><div class="mini" style="margin-top:4px">' + esc(o.client_name) + '</div></div></div>' +
      '<div class="pr-meta"><div><span>Fecha del pedido</span><b>' + fmt(o.order_date) + '</b></div><div><span>Estado</span><b>' + esc(o.status) + '</b></div>' +
      '<div><span>' + (o.status === 'Entregado' ? 'Entregado el' : 'Entrega estimada') + '</span><b>' + (o.status === 'Entregado' ? fmt(o.delivered_at) : (o.est_delivery ? fmt(o.est_delivery) : '—')) + '</b></div>' +
      '<div><span>Artículos</span><b>' + o.units + ' uds</b></div></div>' +
      cron +
      '<h2>Artículos pedidos</h2><table><thead><tr><th style="width:44px"></th><th>Artículo</th><th>Talla</th><th>Color</th><th>Acabados</th><th style="text-align:right">Uds</th>' + (pr ? '<th style="text-align:right">Precio</th><th style="text-align:right">Importe</th>' : '') + '</tr></thead><tbody>' + body + '</tbody></table>' +
      (pr ? '<div style="text-align:right;margin-top:10px;font-size:15px"><div>Base imponible: ' + money(o.total) + '</div><div>IVA 21 %: ' + money(o.iva) + '</div><b style="font-size:17px">Total con IVA: ' + money(o.total_iva) + '</b>' + (o.unpriced ? '<div class="mini">' + o.unpriced + ' línea(s) sin precio no están incluidas</div>' : '') + '</div>' : '') +
      (o.notes ? '<h2>Notas</h2><p>' + esc(o.notes).replace(/\n/g, '<br>') + '</p>' : '') +
      '<div class="pr-foot">Documento generado el ' + fmt(S.today) + '. MSH Madrid.</div>';
    const imgs = [...document.images].filter(i => !i.complete);
    await Promise.all(imgs.map(i => new Promise(res => { i.onload = i.onerror = res; })));
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) { /* da igual */ } }
    setTimeout(() => window.print(), 500);
  } catch (e) {
    root.innerHTML = '<p>No se pudo preparar el PDF: ' + esc(e.message) + '</p>';
  }
})();
</script>
</body>
</html>
